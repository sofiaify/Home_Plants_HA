name: "Home Plants"
version: "1.0.10"
slug: "plants"
description: "Track your houseplants, get watering reminders, and auto-adjust schedules from weather."
url: "https://github.com/your/plants-app"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:flower
panel_title: Plants
panel_admin: false
ports:
  "8099/tcp": 8099
ports_description:
  "8099/tcp": "Plants web interface"
options:
  ha_weather_entity: ""
  ha_outdoor_temp_entity: ""
  ha_indoor_temp_entity: ""
  ha_rain_entity: ""
  notify_services: []
  email_to: []
  notify_time: "08:00"
  timezone: "UTC"
  fertilize_months:
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
  plantnet_api_key: ""
  plantnet_project: "all"
  plantnet_lang: "en"
schema:
  ha_weather_entity: str
  ha_outdoor_temp_entity: str
  ha_indoor_temp_entity: str
  ha_rain_entity: str
  notify_services:
    - str
  email_to:
    - str
  notify_time: str
  timezone: str
  fertilize_months:
    - int
  plantnet_api_key: password
  plantnet_project: str
  plantnet_lang: str
